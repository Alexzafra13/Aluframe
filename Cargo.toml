[workspace]
resolver = "3"
members = ["crates/dominio", "crates/servidor"]

[workspace.package]
version = "0.24.1"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-privado"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"

# Optimizado por tamaño: 11,5 MB → unos 8,5 MB. Todo responde en milisegundos, así que no se
# nota; salvo Argon2 (cada entrada) y SQLite, que siguen optimizados por velocidad.
# Sin `panic = "abort"`: un fallo en una petición no debe tirar el programa entero.
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true

[profile.release.package.argon2]
opt-level = 3

[profile.release.package.blake2]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3

# Solo las líneas para los mensajes de error: los ejecutables de prueba pesan y tardan menos en
# enlazarse (ADR-0035). Para depurar paso a paso, `debug = true` en local.
[profile.dev]
debug = "line-tables-only"

# Para las pruebas E2E en local: el mismo código optimizado, sin el LTO lento del publicado.
# CI pasa la E2E con el ejecutable de `release`, el que se publica (ADR-0035).
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
