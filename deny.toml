[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "tokio", wrappers = ["servidor", "axum", "hyper", "hyper-util", "tower"] },
    { name = "rusqlite", wrappers = ["servidor"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
