# Acabados (colores) que vienen con el programa (ADR-0019). Se cargan al arrancar: si un acabado
# no existe se crea; si existe, se le ponen el RAL, el color del dibujo, la superficie, la veta y
# los cierres de este archivo. El recargo sobre el blanco lo pone el propietario en Catálogo >
# Acabados y nunca se toca desde aquí.
#
# Color del dibujo: el valor en pantalla publicado para cada RAL (aproximado: solo la carta física
# es exacta). Las imitaciones de madera (foliado) y los anodizados no tienen RAL: su color es solo
# para el dibujo. RAL y superficies PROVISIONALES hasta que el propietario los confirme
# (2026-11-22); el blanco en brillo lo indicó él.
#
# Campos: nombre, ral (opcional), color (#rrggbb), superficie (brillo | mate | texturado |
# anodizado; brillo si falta), madera (sí/no: veta), cierres (blanco | negro), base (solo uno).

acabados:
  - { nombre: "Blanco",           ral: "9016", color: "#f2f2ed", superficie: brillo,    madera: false, cierres: blanco, base: true }
  - { nombre: "Negro",            ral: "9005", color: "#0e0e10", superficie: texturado, madera: false, cierres: negro }
  - { nombre: "Gris antracita",   ral: "7016", color: "#373f43", superficie: texturado, madera: false, cierres: negro }
  - { nombre: "Verde",            ral: "6005", color: "#0f4336", superficie: brillo,    madera: false, cierres: negro }   # verde musgo
  - { nombre: "Marrón",           ral: "8014", color: "#49392d", superficie: brillo,    madera: false, cierres: negro }   # marrón sepia
  - { nombre: "Anodizado plata",               color: "#c3c6c8", superficie: anodizado, madera: false, cierres: negro }
  - { nombre: "Anodizado bronce",              color: "#6e5a43", superficie: anodizado, madera: false, cierres: negro }
  - { nombre: "Pino nudo",                     color: "#d0a065", superficie: mate,      madera: true,  cierres: negro }   # foliado imitación madera
  - { nombre: "Nogal",                         color: "#6b4530", superficie: texturado, madera: true,  cierres: negro }   # foliado imitación madera
  - { nombre: "Embero",                        color: "#8a5a3c", superficie: mate,      madera: true,  cierres: negro }   # nombre por confirmar
  - { nombre: "Roble",                         color: "#b07a45", superficie: texturado, madera: true,  cierres: negro }   # foliado imitación madera
