# Serie Aluprom 21 (fabricante: Aluval), con datos aportados por el propietario.
# VALIDADA por el propietario el 2026-11-22 tras probar las medidas de corte de la 2 y la 4 hojas.
# Lo que sigue en CONFIRMAR es un dato que aún no existe (cristal, referencias de accesorios,
# proveedor): mientras falte, la ventana sale «incompleta» y no tiene precio final. No inventar valores.

serie: ALUPROM_21
fabricante: ALUVAL
proveedor: CONFIRMAR                          # quién vende estos perfiles al taller (distribuidor): por confirmar
estado: validada                               # el propietario lo ha probado y da por buenas las medidas (2026-11-22)
unidades: cm                                   # el usuario trabaja en cm; un decimal de cm = 1 mm
redondeo: { precision: 0.1, sentido: abajo }   # a 0,1 cm (1 mm) hacia abajo (confirmado por el propietario, 2026-11-22)
longitud_barra: 640                            # barras nuevas de 6,40 m (confirmado por el usuario)

parametros:
  descuento_marco_horizontal: 4.1  # marco superior e inferior = ancho - 4,1
  descuento_hoja_vertical: 5.3     # hoja lateral y hoja cierre = alto - 5,3
  descuento_hoja_horizontal: 2     # corredera de 2 hojas: hoja de rodamiento = ancho / 2 - 2
  descuento_hoja_4_hojas: 3        # corredera de 4 hojas: hoja de rodamiento = (ancho - 3) / 4

# Qué referencia del proveedor corresponde a cada código de este archivo. Mientras una referencia esté en CONFIRMAR,
# las piezas se calculan igualmente pero la línea no tiene precio final. Se rellenan al importar la tarifa real.
# Los nombres de las hojas son los del catálogo de Aluval (decisión del propietario, 2026-11-22).
# `silueta`: dibujo de la sección (data/perfiles/aluval) o del herraje (data/perfiles/herrajes, dibujos propios y
# genéricos), solo para reconocer la pieza; no fija el precio ni el modelo, que los da el artículo del catálogo.
# Hojas según el acristalamiento (confirmado por el propietario, 2026-11-22): cristal normal -> 21310, 21340, 21350;
# Climalit (doble) -> 21312, 21341, 21351. Se elige en la línea con la opción «acristalamiento» (ADR-0018).
referencias:
  MARCO_LATERAL:    { referencia: "21210", silueta: aluval/21210 }   # confirmado por el propietario (2026-11-22)
  MARCO_SUPERIOR:   { referencia: "21220", silueta: aluval/21220 }   # confirmado
  MARCO_INFERIOR:   { referencia: "21230", silueta: aluval/21230 }   # confirmado: el de cámara, con cualquier cristal
  HOJA_LATERAL:     { referencia: "21310", silueta: aluval/21310 }   # contra el marco
  HOJA_CIERRE:      { referencia: "21340", silueta: aluval/21340 }   # la del gancho, en el centro
  HOJA_RODAMIENTO:  { referencia: "21350", silueta: aluval/21350 }
  HOJA_LATERAL_CLIMALIT:    { referencia: "21312", silueta: aluval/21312 }
  HOJA_CIERRE_CLIMALIT:     { referencia: "21341", silueta: aluval/21341 }
  HOJA_RODAMIENTO_CLIMALIT: { referencia: "21351", silueta: aluval/21351 }
  # Solo en la de 4 hojas: une las dos hojas centrales (propietario, 2026-11-23). Igual con cualquier cristal.
  CIERRE_4_HOJAS:   { referencia: "21344", silueta: aluval/21344 }
  # Referencias genéricas del taller, no del proveedor (propietario, 2026-11-22: «de momento, un kit de corredera
  # y ruedas»). Se da de alta el artículo con esta referencia en Catálogo > Artículos y la ventana toma su precio.
  # KIT_CORREDERA es el kit de plásticos (tapetas de las hojas, cortavientos y juntas de estanqueidad adhesivas;
  # en Aluval, el 9426065), con referencia genérica porque puede comprarse de otra marca (propietario, 2026-11-23).
  KIT_CORREDERA:    { referencia: "KIT-CORREDERA", silueta: herrajes/kit-plasticos }
  CIERRE_EMBUTIDO:  { referencia: "CIERRE-EMBUTIDO", silueta: herrajes/cierre-embutido }   # genérico: hoy, Alualpha 267 i (el modelo va en el artículo)
  RUEDA_CORREDERA:  { referencia: "RUEDA-CORREDERA", silueta: herrajes/rueda }
  TORNILLO_4_8x25:  { referencia: "TORNILLO-4,8X25", silueta: herrajes/tornillo }   # 4,8 × 25, cabeza redonda de estrella (propietario)
  # El cristal se cobra por m² con el artículo de referencia «CRISTAL»; en cada ventana se puede elegir otro.
  CRISTAL:          { referencia: "CRISTAL" }

tipologias:
  corredera_2_hojas:
    nombre: "Ventana corredera 2 hojas"
    dibujo: { tipo: corredera, hojas: 2, hoja_movil: ambas }     # se abren las dos; cierre en cada lateral, como Aluval (propietario)
    opciones:                      # el tipo y la cámara del Climalit se concretarán más adelante
      - { codigo: acristalamiento, nombre: "Acristalamiento", valores: [cristal_normal, climalit], por_defecto: cristal_normal }
    piezas:
      - { perfil: MARCO_LATERAL,   cantidad: 2, longitud: "alto",                                    corte: 90 }
      - { perfil: MARCO_SUPERIOR,  cantidad: 1, longitud: "ancho - descuento_marco_horizontal",      corte: 90 }
      - { perfil: MARCO_INFERIOR,  cantidad: 1, longitud: "ancho - descuento_marco_horizontal",      corte: 90 }
      - { perfil: HOJA_LATERAL,    perfil_segun: { acristalamiento: { climalit: HOJA_LATERAL_CLIMALIT } }, cantidad: 2, longitud: "alto - descuento_hoja_vertical",          corte: 90 }
      - { perfil: HOJA_CIERRE,     perfil_segun: { acristalamiento: { climalit: HOJA_CIERRE_CLIMALIT } }, cantidad: 2, longitud: "alto - descuento_hoja_vertical",          corte: 90, posicion: hoja_central }
      - { perfil: HOJA_RODAMIENTO, perfil_segun: { acristalamiento: { climalit: HOJA_RODAMIENTO_CLIMALIT } }, cantidad: 4, longitud: "ancho / 2 - descuento_hoja_horizontal",   corte: 90 }
    vidrio:
      # Dos cristales, uno por hoja (propietario, 2026-11-22). Ancho: ancho / 2 - 9,8 (el propietario, y el
      # plano de Aluval: (L/2) - 98 mm). Alto: PROVISIONAL, alto de la hoja (alto - 5,3) menos los 7,8 cm que
      # pierde el cristal en el ancho; el plano no lo acota. Comprobar con un cristal real.
      tipo: CRISTAL
      piezas:
        - { cantidad: 2, ancho: "ancho / 2 - 9.8", alto: "alto - 13.1" }
    accesorios:
      - { articulo: KIT_CORREDERA,   cantidad: 1 }                  # kit de plásticos; un único artículo
      - { articulo: CIERRE_EMBUTIDO, cantidad: 2 }                  # uno en cada lateral (propietario, 2026-11-23)
      - { articulo: RUEDA_CORREDERA, cantidad: 4 }
      - { articulo: TORNILLO_4_8x25, cantidad: 9, aplica_a: marco }
      - { articulo: TORNILLO_4_8x25, cantidad: 8, aplica_a: hojas } # 8 en total para las dos hojas

  corredera_4_hojas:
    nombre: "Ventana corredera 4 hojas"
    dibujo: { tipo: corredera, hojas: 4 }          # se abren las cuatro: cierre en cada lateral y dos en el centro (propietario)
    opciones:                      # el tipo y la cámara del Climalit se concretarán más adelante
      - { codigo: acristalamiento, nombre: "Acristalamiento", valores: [cristal_normal, climalit], por_defecto: cristal_normal }
    # Igual que la de 2 hojas salvo la hoja de rodamiento y las cantidades (el doble de hojas).
    piezas:
      - { perfil: MARCO_LATERAL,   cantidad: 2, longitud: "alto",                                    corte: 90 }
      - { perfil: MARCO_SUPERIOR,  cantidad: 1, longitud: "ancho - descuento_marco_horizontal",      corte: 90 }
      - { perfil: MARCO_INFERIOR,  cantidad: 1, longitud: "ancho - descuento_marco_horizontal",      corte: 90 }
      - { perfil: HOJA_LATERAL,    perfil_segun: { acristalamiento: { climalit: HOJA_LATERAL_CLIMALIT } }, cantidad: 4, longitud: "alto - descuento_hoja_vertical",          corte: 90 }  # el doble que en la de 2 hojas
      - { perfil: HOJA_CIERRE,     perfil_segun: { acristalamiento: { climalit: HOJA_CIERRE_CLIMALIT } }, cantidad: 4, longitud: "alto - descuento_hoja_vertical",          corte: 90, posicion: hoja_central }  # el doble
      - { perfil: HOJA_RODAMIENTO, perfil_segun: { acristalamiento: { climalit: HOJA_RODAMIENTO_CLIMALIT } }, cantidad: 8, longitud: "(ancho - descuento_hoja_4_hojas) / 4",    corte: 90 }  # el doble; primero se resta y luego se divide
      # Mide lo mismo que el alto de la hoja (propietario, 2026-11-23): una pieza donde se juntan las centrales.
      - { perfil: CIERRE_4_HOJAS,  cantidad: 1, longitud: "alto - descuento_hoja_vertical",          corte: 90, posicion: centro }
    vidrio:
      estado: CONFIRMAR            # el usuario dará la medida cuando sepa el descuento
    accesorios:
      - { articulo: KIT_CORREDERA,   cantidad: 2 }                  # confirmado por el usuario: 2 kits iguales
      - { articulo: CIERRE_EMBUTIDO, cantidad: 4 }                  # dos en los laterales y dos en el centro (propietario, 2026-11-23)
      - { articulo: RUEDA_CORREDERA, cantidad: 8 }                  # el doble que en la de 2 hojas (confirmado, 2026-11-22)
      - { articulo: TORNILLO_4_8x25, cantidad: 9,  aplica_a: marco }  # el marco no cambia (confirmado)
      - { articulo: TORNILLO_4_8x25, cantidad: 16, aplica_a: hojas }  # el doble que en la de 2 hojas (confirmado)
