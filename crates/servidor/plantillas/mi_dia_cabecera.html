<header class="barra-operario">
  <a class="marca" href="/mi-dia"><span class="marca-logo" aria-hidden="true"></span>Mi día</a>
  <nav class="atajos-operario" aria-label="Secciones">
    <a class="boton" href="/apuntes">Apuntes</a>
    <a class="boton" href="/clientes">Clientes</a>
    {% if !usuario.es_propietario && usuario.ve_presupuestos %}<a class="boton" href="/presupuestos">Presupuestos</a>{% endif %}
    {% if !usuario.es_propietario && usuario.ve_facturas %}<a class="boton" href="/facturas">Facturas</a>{% endif %}
  </nav>
  <span class="usuario-actual">{{ usuario.nombre }}</span>
  {% if usuario.es_propietario %}<a class="boton" href="/">Volver al inicio</a>{% endif %}
  <form method="post" action="/salir">
    <input type="hidden" name="_csrf" value="{{ usuario.token_csrf }}">
    <button class="boton" type="submit">Salir</button>
  </form>
</header>
