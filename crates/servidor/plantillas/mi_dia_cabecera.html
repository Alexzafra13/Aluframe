<header class="barra-operario">
  <a class="marca" href="/mi-dia"><img class="marca-simbolo" src="/recursos/marca/simbolo.png?v={{ crate::vistas::VERSION }}" alt="" width="46" height="24">Mi día</a>
  <span class="usuario-actual">{{ usuario.nombre }}</span>
  {% if usuario.es_propietario %}<a class="boton" href="/">Volver al inicio</a>{% endif %}
  <form method="post" action="/salir">
    <input type="hidden" name="_csrf" value="{{ usuario.token_csrf }}"><input type="hidden" name="_envio" value="{{ crate::vistas::nuevo_envio() }}">
    <button class="boton" type="submit">Salir</button>
  </form>
</header>
