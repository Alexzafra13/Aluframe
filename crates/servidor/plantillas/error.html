{% extends "base.html" %}
{% block titulo %}Error{% endblock %}
{% block clase_body %}pantalla-acceso{% endblock %}
{% block cuerpo %}
<main class="acceso">
  <div class="tarjeta">
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    {% if let Some(codigo) = codigo %}<p class="texto-apagado">Código del error: <code>{{ codigo }}</code></p>{% endif %}
    <a class="boton" href="/">Volver al inicio</a>
  </div>
</main>
{% endblock %}
