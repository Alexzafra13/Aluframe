{% for o in lista %}
<div class="campo">
  <label for="opcion-{{ o.codigo }}">{{ o.nombre }}</label>
  <select id="opcion-{{ o.codigo }}" name="opcion.{{ o.codigo }}">
    {% for (valor, texto) in o.valores %}<option value="{{ valor }}"{% if *valor == o.elegido %} selected{% endif %}>{{ texto }}</option>{% endfor %}
  </select>
</div>
{% endfor %}
