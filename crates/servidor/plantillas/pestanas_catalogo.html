<nav class="pestanas" aria-label="Secciones del catálogo">
  {% for (ruta, nombre) in [("/catalogo/articulos", "Artículos"), ("/catalogo/proveedores", "Proveedores"), ("/catalogo/acabados", "Acabados"), ("/catalogo/tarifas", "Tarifas"), ("/catalogo/series", "Series")] %}
  <a class="pestana{% if *nombre == pestana %} activa{% endif %}" href="{{ ruta }}"{% if *nombre == pestana %} aria-current="page"{% endif %}>{{ nombre }}</a>
  {% endfor %}
</nav>
