[package]
name = "servidor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "alumframe"
path = "src/main.rs"

# La aplicación de escritorio (ADR-0015): sin consola en Windows.
[[bin]]
name = "alumframe-escritorio"
path = "src/escritorio_main.rs"

[dependencies]
dominio = { path = "../dominio" }
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rust-embed = "8.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.1"
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
# Reenviar una petición al enrutador de la demostración (ADR-0028); ya la usa Axum por dentro.
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
yaml-rust2 = { version = "0.13.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]

[lints]
workspace = true
