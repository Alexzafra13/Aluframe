name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Servidor Linux (estático, musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p servidor --target x86_64-unknown-linux-musl
      - name: Empaquetar
        run: |
          carpeta=alumframe-${GITHUB_REF_NAME}-linux-x86_64
          mkdir -p "$carpeta"
          cp target/x86_64-unknown-linux-musl/release/alumframe "$carpeta/"
          cp -r despliegue/linux/. "$carpeta/"
          tar czf "$carpeta.tar.gz" "$carpeta"
      - uses: softprops/action-gh-release@v2
        with:
          files: alumframe-*.tar.gz

  windows:
    name: Windows (modo local)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p servidor
      - name: Empaquetar
        shell: pwsh
        run: |
          $carpeta = "alumframe-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $carpeta | Out-Null
          Copy-Item target/release/alumframe.exe $carpeta/
          Copy-Item despliegue/windows/* $carpeta/
          Compress-Archive -Path $carpeta -DestinationPath "$carpeta.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: alumframe-*.zip
