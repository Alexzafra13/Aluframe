name: Publicar versión

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (por ejemplo v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Decidir si hay versión nueva
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.decidir.outputs.version }}
      publicar: ${{ steps.decidir.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decidir
        env:
          ENTRADA: ${{ inputs.version }}
        run: |
          if [ -n "$ENTRADA" ]; then
            version="$ENTRADA"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión no válida: $version"; exit 1; }
          publicar=true
          if [[ "$GITHUB_REF" == refs/heads/* ]] && git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            publicar=false
            echo "La versión $version ya está publicada; no hay nada que hacer."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"

  linux:
    name: Servidor Linux (estático, musl)
    needs: version
    if: needs.version.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p servidor --target x86_64-unknown-linux-musl
      - name: Empaquetar
        run: |
          carpeta=alumframe-${VERSION}-linux-x86_64
          mkdir -p "$carpeta"
          cp target/x86_64-unknown-linux-musl/release/alumframe "$carpeta/"
          cp -r despliegue/linux/. "$carpeta/"
          tar czf "$carpeta.tar.gz" "$carpeta"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: AlumFrame ${{ env.VERSION }}
          files: alumframe-*.tar.gz

  windows:
    name: Windows (modo local)
    needs: [version, linux]
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p servidor
      - name: Empaquetar
        shell: pwsh
        run: |
          $carpeta = "alumframe-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory $carpeta | Out-Null
          Copy-Item target/release/alumframe.exe $carpeta/
          Copy-Item despliegue/windows/* $carpeta/
          Compress-Archive -Path $carpeta -DestinationPath "$carpeta.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: alumframe-*.zip
